auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 12h #5m - if you are rich you can continue use it
  max_chunk_age: 24h #1h - if you are rich you can continue use it
  chunk_target_size: 1536000

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: s3
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  aws:
    bucketnames: ${AWS_S3_BUCKET_NAME}
    endpoint: ${AWS_S3_ENDPOINT}
    region: ${AWS_S3_REGION}
    access_key_id: ${AWS_S3_ACCESS_KEY}
    secret_access_key: ${AWS_S3_SECRET_KEY}
    s3forcepathstyle: false
    insecure: false
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: s3

limits_config:
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_cache_freshness_per_query: 10m

compactor:
  working_directory: /loki/compactor
  shared_store: s3

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h